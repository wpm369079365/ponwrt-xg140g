#
# P3TERX style builder, adapted for pbs05/ponwrt -> XG-140G-MD
#
name: Build XG-140G-MD

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/pbs05/ponwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force || true
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT "$PWD"
        git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
        ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Load custom patches (before feeds)
      run: |
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && cp -a files openwrt/
        cp "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        echo "===== selected device ====="
        grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true
        echo "===== key plugins ====="
        grep -E '^CONFIG_PACKAGE_(luci-app-homeproxy|sing-box|luci-app-ddns|luci-app-openlist|openlist|vlmcsd|luci-app-vlmcsd|ppp-mod-pppoe)=y$' .config || true
        make download -j8
        find dl -size -1024c -exec rm -f {} +

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j"$(nproc)" || make -j1 || make -j1 V=s
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Check space usage
      if: ${{ !cancelled() }}
      run: df -hT

    - name: Organize files
      id: organize
      if: ${{ steps.compile.outputs.status == 'success' && !cancelled() }}
      run: |
        cd openwrt/bin/targets/airoha/an7581
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"
        echo "===== firmware files ====="
        ls -lh

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: ${{ steps.organize.outputs.status == 'success' && !cancelled() }}
      with:
        name: XG-140G-MD-firmware
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: ${{ env.UPLOAD_RELEASE == 'true' && !cancelled() }}
      run: |
        echo "release_tag=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
        {
          echo "XG-140G-MD firmware (pbs05/ponwrt, AN7581)"
          echo
          echo "源码: $REPO_URL ($REPO_BRANCH)"
          echo "插件: HomeProxy + sing-box, DDNS, OpenList, KMS(vlmcsd), PPPoE/PON"
          echo "登录: 10.0.0.1 / root / password"
        } > release.txt

    - name: Publish release via gh
      if: ${{ steps.tag.outputs.release_tag && steps.organize.outputs.status == 'success' && !cancelled() }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "$GITHUB_WORKSPACE"
        tag="${{ steps.tag.outputs.release_tag }}"
        repo="$GITHUB_REPOSITORY"
        if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
          gh release edit "$tag" --repo "$repo" --notes-file release.txt --title "$tag"
          gh release upload "$tag" "$FIRMWARE"/* --repo "$repo" --clobber
        else
          gh release create "$tag" "$FIRMWARE"/* --repo "$repo" --title "$tag" --notes-file release.txt
        fi
        gh release view "$tag" --repo "$repo" --json url,assets \
          --jq '"release: \(.url)  assets: \([.assets[].name] | join(", "))"' \
          | tee -a "$GITHUB_STEP_SUMMARY"
